name: HemoVision CI Pipeline

on:
  push:
    branches: [ main, phase-* ]
  pull_request:
    branches: [ main, phase-* ]

jobs:
  validate-schemas-and-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema

      - name: Run Schema & Syntax Unit Tests
        run: |
          pytest ml/tests/
