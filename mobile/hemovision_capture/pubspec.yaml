name: hemovision_capture
description: >
  HemoVision Smartphone Conjunctival Imaging Research Prototype.
  Phase 2: Image acquisition, on-device quality scoring, and research metadata generation.
  This is NOT a diagnostic application.
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: ^3.12.0-103.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera capture
  camera: ^0.12.0+2

  # Sensor data (accelerometer, gyroscope)
  sensors_plus: ^7.1.0

  # App-private file storage paths
  path_provider: ^2.1.6

  # UUID v4 generation for session/image/participant IDs
  uuid: ^4.6.0

  # ISO 8601 timestamp formatting
  intl: ^0.20.3

  # Device manufacturer/model metadata
  device_info_plus: ^13.2.0

  # Pixel-level image quality analysis
  image: ^4.9.1

  # HTTP client for API backend integration
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
